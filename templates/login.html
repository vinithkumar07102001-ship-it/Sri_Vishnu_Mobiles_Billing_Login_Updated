<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | SRI VISHNU MOBILES</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"><style>.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#10182b,#172b49)}.login-card{width:min(100%,420px);background:#fff;border-radius:18px;padding:30px;box-shadow:0 20px 60px #0004}.login-brand{text-align:center;margin-bottom:24px}.login-brand .brand-mark{margin:auto auto 12px}.login-card label{display:block;font-weight:600;margin:14px 0 6px}.login-card input{width:100%;padding:12px;border:1px solid #d8deea;border-radius:9px}.login-card button{width:100%;margin-top:20px}.login-note{color:#697386;font-size:12px;text-align:center;margin-top:16px}</style></head><body><main class="login-wrap"><section class="login-card"><div class="login-brand"><div class="brand-mark">SV</div><h2>SRI VISHNU MOBILES</h2><p>Billing & Inventory Management</p></div>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{request.args.get('next','')}}"><label>Username</label><input name="username" autocomplete="username" required autofocus><label>Password</label><input type="password" name="password" autocomplete="current-password" required><button class="btn primary" type="submit">Login</button></form><p class="login-note">Authorized users only · Secure login</p></section></main></body></html>
